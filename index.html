<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Winesett.com — The Time Machine Company</title>
  <meta name="description" content="Winesett.com. The Time Machine Company.">
  <link rel="canonical" href="https://winesett.com/">
  <meta property="og:title" content="Winesett.com — The Time Machine Company">
  <meta property="og:url" content="https://winesett.com/">
  <meta property="og:type" content="website">
  <style>
    :root { color-scheme: light; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #21211e; background: #f9f8f4; }
    * { box-sizing: border-box; }
    body { margin: 0 auto; width: min(1320px, 89%); min-height: 100svh; display: flex; flex-direction: column; }
    header, footer { display: flex; justify-content: space-between; align-items: center; padding: 25px 0; gap: 16px; }
    header { border-bottom: 1px solid #cfcec6; }
    header strong { font-size: 1.2rem; letter-spacing: -.045em; }
    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 4px; }
    main { flex: 1; display: grid; grid-template-columns: 1.25fr 1fr; align-items: center; gap: 6vw; padding: 8vh 0; }
    h1 { font-size: clamp(3.1rem, 7.5vw, 7.6rem); line-height: .96; letter-spacing: -.07em; margin: 0; font-weight: 550; }
    h1 em { font-family: Georgia, serif; font-weight: 400; }
    .clock { position: relative; aspect-ratio: 1; width: min(100%, 440px); justify-self: center; border-radius: 50%; background: #efca54; }
    .clock::before { content: ""; position: absolute; inset: 4%; border-radius: 50%; background: repeating-conic-gradient(#312e22 0 .5deg, transparent .5deg 6deg); mask: radial-gradient(circle closest-side, transparent 92%, black 93%); }
    .hands { position: absolute; inset: 0; }
    .hands::before, .hands::after { content: ""; position: absolute; bottom: 50%; left: 50%; width: 1.3%; height: 29%; background: #26251e; border-radius: 6px; transform-origin: bottom center; transform: translateX(-50%) rotate(-58deg); }
    .hands::after { height: 39%; width: .85%; transform: translateX(-50%) rotate(58deg); }
    footer { border-top: 1px solid #cfcec6; font-size: .9rem; }
    @media (max-width: 650px) {
      main { grid-template-columns: 1fr; align-content: center; gap: 40px; padding: 48px 0; }
      .clock { width: min(65vw, 300px); }
    }
  </style>
</head>
<body>
  <header><strong>Winesett.com</strong><a href="https://labs.winesett.com/">Winesett Labs ↗</a></header>
  <main>
    <h1>The <em>Time</em><br>Machine<br>Company</h1>
    <div class="clock" aria-hidden="true"><span class="hands"></span></div>
  </main>
  <footer><span>Winesett</span><a href="mailto:codywinesett@gmail.com">Contact</a></footer>
</body>
</html>
