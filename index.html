<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Winesett — The Time Machine Company</title>
  <meta name="description" content="Winesett. The Time Machine Company.">
  <link rel="canonical" href="https://winesett.com/">
  <meta property="og:title" content="Winesett — The Time Machine Company">
  <meta property="og:url" content="https://winesett.com/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://winesett.com/assets/prius-emo.webp">
  <style>
    :root { color-scheme: dark; background: #040405; color: white; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    body { margin: 0; }
    main { position: relative; isolation: isolate; display: grid; min-height: 100vh; min-height: 100dvh; }
    picture { position: absolute; inset: 0; z-index: -1; }
    img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 85% center; }
    header { align-self: start; margin: 28vh max(6.6vw, env(safe-area-inset-left)); }
    h1 { margin: 0; font-size: clamp(3rem, 5.8vw, 9rem); font-weight: 550; letter-spacing: -.055em; line-height: 1; }
    p { margin: .36em 0 0; font-size: clamp(1rem, 2.15vw, 3rem); letter-spacing: -.025em; line-height: 1.2; color: #f2ece3; }
    .labs-link { display: inline-flex; align-items: center; gap: .65em; min-height: 44px; margin-top: .65rem; color: inherit; font-weight: 550; text-decoration-thickness: 1px; text-underline-offset: .24em; }
    .labs-link:hover { color: #ffdfa9; }
    .labs-link:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    @media (max-aspect-ratio: 1/1) {
      header { margin: max(12svh, env(safe-area-inset-top)) 7vw 0; }
      h1 { font-size: clamp(3rem, 12vw, 6rem); }
      p { font-size: clamp(1.15rem, 4.8vw, 2.35rem); }
      img { object-position: 68% 67%; }
    }
    @media (min-aspect-ratio: 1/1) and (max-aspect-ratio: 3/2) {
      header { margin-top: 9vh; }
    }
  </style>
</head>
<body>
  <main>
    <picture>
      <source media="(max-aspect-ratio: 1/1)" srcset="/assets/prius-emo-portrait.webp">
      <img src="/assets/prius-emo.webp" alt="A black Prius time machine under a parking lot light, with a Kentucky plate reading EMO." fetchpriority="high">
    </picture>
    <header>
      <h1>Winesett</h1>
      <p>The Time Machine Company</p>
      <a class="labs-link" href="https://labs.winesett.com/">Explore Winesett Labs <span aria-hidden="true">→</span></a>
    </header>
  </main>
</body>
</html>
